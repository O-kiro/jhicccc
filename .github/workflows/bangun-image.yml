# Membangun image frontend di GitHub Actions, bukan di VPS.
#
# VPS-nya OpenVZ dengan RAM 4 GiB dan numproc 500 (≈390 terpakai saat diam).
# Build Next di sana gagal berulang kali dengan wujud yang berbeda-beda —
# kehabisan slot thread di tokio, rayon, dan libvips; SIGSEGV saat heap V8
# menyentuh plafon; lalu proses Node gagal tersambung dalam 30 detik. Semua
# tuas sudah ditekan ke 1 dan tetap tidak cukup.
#
# Runner GitHub native amd64, 4 CPU, 16 GB, dan gratis untuk repo publik.
# Hasilnya: rilis berikutnya cuma `docker compose pull && up -d` — sekitar
# satu menit, tanpa situs mati sepuluh menit.
name: Bangun image frontend

on:
  push:
    branches: [main]
    # Dokumentasi dan berkas non-kode tidak perlu memicu build.
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "!.github/workflows/bangun-image.yml"
  workflow_dispatch:

jobs:
  bangun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bangun dan dorong
        uses: docker/build-push-action@v6
        with:
          context: .
          target: produksi
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/o-kiro/jhicccc:latest
            ghcr.io/o-kiro/jhicccc:${{ github.sha }}
          # Dibaca saat build dan tercetak permanen ke sitemap.xml, robots.txt,
          # tag kanonik, dan gambar OpenGraph. API_URL memakai alias jaringan
          # Docker, bukan alamat publik: container tidak bisa memanggil IP
          # publiknya sendiri di VPS ber-NAT.
          build-args: |
            SITE_URL=https://jhic26.rezasidin.my.id
            API_URL=http://backend:8000/api/v1
          # Runner-nya lega, jadi batas thread tidak perlu diturunkan di sini.
          cache-from: type=gha
          cache-to: type=gha,mode=max
