# Jalankan:  docker compose -f compose.prod.yaml up -d --build
#
# Untuk server. Berbeda dengan compose.yaml: situs dibangun sekali
# (`next build`) lalu dijalankan dengan `next start` sebagai NODE_ENV=production.
#
# Variabel di bawah diisi lewat shell atau berkas .env di folder ini — Compose
# membacanya, tapi berkas itu tidak ikut masuk ke image.
#
# API_URL wajib alamat publik backend (mis. https://api.domain-anda/api/v1):
# compose.prod.yaml backend hanya membuka port 8000 untuk 127.0.0.1, jadi di
# server Linux container ini tidak bisa menjangkaunya lewat host.docker.internal.
# SITE_URL bawaannya domain lomba JHIC 2026; isi hanya bila pindah domain.
# Nilainya dibaca saat build dan tercetak permanen ke sitemap.xml, robots.txt,
# tag kanonik, dan gambar OpenGraph — salah isi berarti build ulang.
#
# Pasang di belakang HTTPS (reverse proxy seperti OpenLiteSpeed bawaan Webuzo,
# Caddy, atau Nginx — lihat DEPLOY.md): di produksi cookie login bertanda
# Secure, jadi browser tidak menyimpannya lewat http:// biasa — kecuali di
# localhost, untuk mencoba.
services:
  web:
    # Image siap pakai dari GitHub Actions. Di server cukup:
    #
    #     docker compose -f compose.prod.yaml pull
    #     docker compose -f compose.prod.yaml up -d
    #
    # Blok `build:` di bawah tetap ada sebagai cadangan — `up -d --build`
    # masih membangun secara lokal bila diperlukan. Di VPS OpenVZ ini jangan:
    # plafon proses dan memorinya tidak cukup, lihat catatan di Dockerfile.
    image: ghcr.io/o-kiro/jhicccc:latest
    build:
      context: .
      target: produksi
      # Dipakai juga saat build (lihat Dockerfile), jadi harus sama dengan
      # nilai saat berjalan di bawah.
      args:
        API_URL: ${API_URL:?isi API_URL dengan alamat publik backend, mis. https://api.domain-anda/api/v1}
        SITE_URL: ${SITE_URL:-https://jhic26.rezasidin.my.id}
        # Jumlah thread yang boleh dipakai saat membangun. Turunkan ke 1 di
        # server kecil — lihat penjelasan lengkapnya di Dockerfile.
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2}
        # Batas heap V8 saat membangun (MB). Turunkan di server ber-RAM kecil.
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-1536}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    # Diikat ke localhost saja: di VPS, "3000:3000" membuka server Next
    # langsung ke internet dan melewati reverse proxy beserta TLS-nya.
    ports:
      # Hanya reverse proxy di server yang boleh menjangkau. Port yang dibuka
      # Docker menembus firewall seperti UFW, jadi "3000:3000" biasa membuat
      # situs terbuka lewat http://IP:3000 tanpa HTTPS.
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: ${API_URL:?isi API_URL dengan alamat publik backend, mis. https://api.domain-anda/api/v1}
      SITE_URL: ${SITE_URL:-https://jhic26.rezasidin.my.id}
      # Harus sama dengan SITUS_REVALIDATE_SECRET backend. Kosong = webhook
      # ditolak; situs tetap menyusul sendiri paling lama 60 detik.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Chatbot tanya-jawab situs. Kosong = asisten menjawab "tidak tersedia".
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Jaringan bersama dengan backend. Tanpa ini, satu-satunya cara memanggil
    # backend adalah lewat alamat publiknya — dan di VPS ber-NAT itu gagal:
    # container harus keluar ke IP publik lalu berbalik masuk lagi (hairpin
    # NAT), yang tidak didukung penyedia. Gejalanya menyesatkan, "fetch
    # failed" dari dalam container padahal alamat yang sama normal dari luar.
    #
    # Dibuat sekali sebelum `up`:  docker network create makoba
    networks:
      default:
      makoba:
        aliases:
          - frontend

networks:
  makoba:
    external: true
